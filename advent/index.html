<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Fragerei Sternbild</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Der Fragerei-Adventskalender: jeden Tag ein Stern, jeden Tag eine Frage.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Manrope:wght@400..700&family=Space+Grotesk:wght@500..700&display=swap">
<style>
:root{
  /* Layout: one centered column on the Fragerei night sky: logo, title, the fir-tree constellation, today's question card; a preview bar only with #vorschau */
  color-scheme: dark;
  --sky:#0d0420; --sky-2:#180a36;
  --ink:#fff3f5; --ink-2:rgba(255,243,245,.8); --ink-3:rgba(255,243,245,.56);
  --line:rgba(255,243,245,.14); --line-2:rgba(255,243,245,.28); --bar:rgba(13,4,32,.9);
  --lime:#d4f77a;
  --grad:linear-gradient(115deg,#5a4ff0,#a83cc0 52%,#d23c63);
  --card:#ffffff; --card-ink:#1d0a33; --card-mute:#7a6a8e;
  --f-disp:"Archivo","Arial Black",sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--sky)}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
.nebula{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(55% 40% at 10% 12%,rgba(90,79,240,.26),transparent 70%),
  radial-gradient(45% 38% at 94% 46%,rgba(210,60,99,.16),transparent 70%),
  radial-gradient(70% 50% at 50% 112%,rgba(168,60,192,.2),transparent 70%)}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.wrap{position:relative;z-index:1;max-width:560px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{padding-block:28px 8px;display:grid;justify-items:center;gap:10px;text-align:center}
.logo{width:150px;height:auto;display:block}
.eyebrow{margin:0;font:600 .7rem/1.3 var(--f-disp);font-stretch:125%;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
h1{margin:0;font:800 clamp(1.9rem,1.3rem + 3vw,2.6rem)/1.02 var(--f-disp);font-stretch:125%;letter-spacing:-.03em;text-wrap:balance}
.lead{margin:0;color:var(--ink-2);max-width:44ch}
main{display:grid;gap:18px;padding-block:14px 40px}
.tree-wrap{display:grid;justify-items:center}
#tree{width:100%;max-width:400px;height:auto;display:block;overflow:visible}
.g-dim{fill:none;stroke:rgba(255,243,245,.16);stroke-width:1.2;stroke-dasharray:2 5}
.g-lit{fill:none;stroke:var(--lime);stroke-width:1.6;stroke-opacity:.75}
.st{cursor:pointer;outline:none}
.st .hit{fill:transparent}
.st .halo,.st .ring{fill:none;stroke:none}
.st .core{fill:transparent;stroke:var(--ink-3);stroke-width:1.3}
.st .num{font:700 11px var(--f-body);fill:var(--ink-3)}
.st.open .core{fill:var(--ink);stroke:none}
.st.open .num{fill:var(--ink-2)}
.st.today .core{fill:var(--lime);stroke:none}
.st.today .halo{stroke:var(--lime);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
.st.today .num{fill:var(--lime);font-weight:800}
.st.sel .ring{stroke:var(--ink);stroke-width:1.4}
.st:focus-visible .ring{stroke:var(--lime);stroke-width:2;stroke-dasharray:3 3}
.shake{animation:shake .38s}
@keyframes pulse{from{transform:scale(.7);opacity:.9}to{transform:scale(1.7);opacity:0}}
@keyframes shake{0%,100%{translate:0}25%{translate:-4px}75%{translate:4px}}
.qcard{background:linear-gradient(var(--card),var(--card)) padding-box,var(--grad) border-box;border:3px solid transparent;border-radius:26px;padding:20px 22px 18px;color:var(--card-ink);display:grid;gap:10px;box-shadow:0 24px 60px -24px rgba(197,90,216,.6)}
.qc-eye{margin:0;font:700 .68rem/1.3 var(--f-disp);font-stretch:125%;letter-spacing:.14em;text-transform:uppercase;color:var(--card-mute)}
.q{margin:0;font:800 clamp(1.35rem,1rem + 1.6vw,1.9rem)/1.12 var(--f-disp);font-stretch:112%;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.qc-foot{margin:0;font-size:.88rem;color:var(--card-mute)}
.qcard.locked .q{background:none;color:var(--card-mute)}
.how{margin:0;text-align:center;font-size:.88rem;color:var(--ink-3)}
body.pv{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.preview{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.preview .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.preview p{margin:0;font-size:.8rem;color:var(--ink-3)}
.day-ctl{display:flex;align-items:center;gap:6px}
.day-ctl button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:transparent;color:var(--ink);font:700 1.1rem/1 var(--f-body);cursor:pointer}
.day-ctl button:disabled{opacity:.3;cursor:default}
.day-ctl output{min-width:10ch;text-align:center;font:700 .95rem/1 var(--f-body);color:var(--lime);font-variant-numeric:tabular-nums}
.foot{position:relative;z-index:1;text-align:center;padding-block:0 32px;color:var(--ink-3);font-size:.84rem}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="hullG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6e9f6"/><stop offset=".55" stop-color="#9aa0c8"/><stop offset="1" stop-color="#5b5f8f"/></linearGradient>
    <symbol id="ufo" viewBox="-130 -42 260 84">
      <ellipse cx="-14" cy="-10" rx="11" ry="10" fill="#b9a7ff"/>
      <ellipse cx="15" cy="-10" rx="10" ry="9" fill="#7fe0c4"/>
      <path d="M-44 4 A44 38 0 0 1 44 4 Z" fill="#bef0ff" fill-opacity=".32" stroke="#dcfaff" stroke-width="2"/>
      <ellipse cx="0" cy="12" rx="124" ry="26" fill="url(#hullG)"/>
      <ellipse cx="0" cy="5" rx="100" ry="10" fill="#ffffff" opacity=".22"/>
      <ellipse cx="0" cy="30" rx="48" ry="9" fill="#4b4f7f"/>
      <ellipse cx="0" cy="34" rx="26" ry="6" fill="#d4f77a" opacity=".9"/>
      <circle cx="-88" cy="18" r="7" fill="#ffd36b"/><circle cx="-46" cy="23" r="7" fill="#ff9e7a"/><circle cx="0" cy="25" r="7" fill="#ffd36b"/><circle cx="46" cy="23" r="7" fill="#ff9e7a"/><circle cx="88" cy="18" r="7" fill="#ffd36b"/>
    </symbol>
  </defs>
</svg>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="nebula" aria-hidden="true"></div>

<header class="wrap top">
  <svg class="logo" viewBox="0 0 420 186" role="img" aria-label="Fragerei">
    <defs>
      <linearGradient id="lgBeamFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4f77a" stop-opacity=".6"/><stop offset="1" stop-color="#d4f77a" stop-opacity=".05"/></linearGradient>
      <linearGradient id="lgText" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
        <stop offset="0" stop-color="#f6ffd8"/><stop offset=".3" stop-color="#d4f77a"/><stop offset=".55" stop-color="#fffbe0"/><stop offset=".8" stop-color="#d4f77a"/><stop offset="1" stop-color="#eaffc0"/>
        <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="7s" repeatCount="indefinite"/>
      </linearGradient>
      <filter id="lgGlow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
    </defs>
    <path d="M178 52 L-6 196 L426 196 L242 52 Z" fill="url(#lgBeamFill)"/>
    <text x="210" y="178" textLength="364" lengthAdjust="spacingAndGlyphs" filter="url(#lgGlow)" fill="#d4f77a" opacity=".6" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="86" text-anchor="middle">Fragerei</text>
    <text x="210" y="178" textLength="364" lengthAdjust="spacingAndGlyphs" fill="url(#lgText)" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="86" text-anchor="middle">Fragerei</text>
    <use href="#ufo" x="145" y="9" width="130" height="42"/>
  </svg>
  <p class="eyebrow">Advent 2026</p>
  <h1>24 Sterne, 24 Fragen</h1>
  <p class="lead">Jeden Tag leuchtet ein Stern mehr am Baum. Tipp drauf, lies die Frage und stell sie jemandem.</p>
</header>

<main class="wrap">
  <div class="tree-wrap">
    <svg id="tree" viewBox="0 0 400 470" role="group" aria-label="Tannenbaum aus 24 Sternen"></svg>
  </div>
  <div class="qcard" id="card" aria-live="polite">
    <p class="qc-eye" id="eye"></p>
    <p class="q" id="q"></p>
    <p class="qc-foot" id="foot"></p>
  </div>
  <p class="how">Im Tram, am Znachttisch, zwischen Tür und Angel. Fröged enand!</p>
</main>

<footer class="wrap foot">fröge fröge fröge ✦ · fragen.fragerei.ch</footer>

<div class="preview" id="preview" hidden>
  <div class="wrap">
    <p>Vorschau fürs Kollektiv</p>
    <div class="day-ctl" role="group" aria-label="Vorschau-Tag">
      <button type="button" id="minus" aria-label="Einen Tag zurück">−</button>
      <output id="dayOut" aria-live="polite"></output>
      <button type="button" id="plus" aria-label="Einen Tag weiter">+</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

// the collective's 24 Advent questions, word for word (the cold question first, as the collective confirmed)
const FRAGEN = [
  'Wie geniesst du die Kälte?',
  'Was war dein längster Lachanfall-Moment? Wo & mit wem?',
  'Wie streitest du?',
  'Was war dein Lieblingsspielzeug?',
  'Was war dein grösster Wunsch für ein Weihnachtsgeschenk in deiner Kindheit?',
  'Wie sieht deine Wunschliste an den Samichlaus heute aus?',
  'Was siehst du ALLES wenn du in den Spiegel schaust?',
  'Was ist dein go-to samichlaus/schmutzli Sprüchli?',
  'Was ist deine Winter-Superpower ?',
  'Wie feierst du dich?',
  'Wie tanzt du zu X-Mas Songs?',
  'Wie schenkst du? (Wie bist du wenn du beschenkt wirst?)',
  'Was ist dein Nordstern?',
  'Wenn dir de Samichlaus irgend ei Frag chönnti beantworte, was würsch umbedingt wele wüsse?',
  'Welches Weihnachtslied sollte nie mehr gespielt werden dürfen?',
  'Du beschmückst den Weihnachtsbaum mit all deinen Fähigkeiten und Ressourcen: was hängt alles am Baum?',
  'Wenn du ein neues Sprüchli erfinden müsstest: wie lautet es und wem würdest du es sagen? (Team Samichlaus oder Team Schmutzli?)',
  'Welcher Wunsch darf im neuen Jahr eine Wahl werden?',
  'Was steht dieses Jahr über dich auf dem Zettel vom Weihnachtsmann?',
  'In all den Jahren seit dich der Weihnachtsmann kennt - wie würde er dich in mind. 5 Sätzen einer fremden Person beschreiben?',
  'Wie drückst du kulinarisch deine Liebe aus?',
  'Was war das im Nachhinein grösstes aber unerwartetes Geschenk dieses Jahr?',
  'Durch welches Tür(chen) willst du nächstes Jahr gehen, dass du noch nie gegangen bist?',
  'Wie strahlst du am hellsten? Wie bringst du dein Stern zum leuchten?',
];

const YEAR = 2026;
const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const WDL = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const dec = d => new Date(YEAR, 11, d);
const long = d => `${WDL[dec(d).getDay()]}, ${d}. Dezember`;
const short = d => `${WD[dec(d).getDay()]}, ${d}. Dez`;

// real day: 0 before 1 Dec 2026, 1–24 in Advent, 24 afterwards
const now = new Date(), today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
const realDay = today0 < dec(1) ? 0 : today0 > dec(24) ? 24 : today0.getDate();
let day = realDay, sel = Math.max(1, realDay), preview = false;

// a garland of 24 stars zigzagging up a fir tree: trunk, five layers, the top star on the 24th
const TREE = [[200, 448], [200, 412], [335, 384], [270, 370], [200, 380], [130, 370], [65, 384], [95, 312], [150, 300], [205, 312], [257, 298], [307, 312], [282, 240], [230, 230], [170, 232], [118, 242], [145, 176], [185, 166], [222, 170], [258, 178], [236, 116], [166, 114], [200, 72], [200, 26]];
const tree = $('#tree');
const starPath = (x, y, R, r) => `M${x} ${y - R}L${x + r} ${y - r}L${x + R} ${y}L${x + r} ${y + r}L${x} ${y + R}L${x - r} ${y + r}L${x - R} ${y}L${x - r} ${y - r}Z`;
svgEl('polyline', { points: TREE.map(p => p.join(',')).join(' '), class: 'g-dim' }, tree);
const lit = svgEl('polyline', { class: 'g-lit' }, tree);
const stars = TREE.map(([x, y], i) => {
  const d = i + 1, g = svgEl('g', { class: 'st', tabindex: '0', role: 'button' }, tree);
  svgEl('circle', { cx: x, cy: y, r: 14, class: 'hit' }, g);
  svgEl('circle', { cx: x, cy: y, r: d === 24 ? 16 : 10, class: 'halo' }, g);
  svgEl('circle', { cx: x, cy: y, r: d === 24 ? 20 : 11, class: 'ring' }, g);
  if (d === 24) svgEl('path', { d: starPath(x, y, 15, 4.2), class: 'core' }, g);
  else svgEl('circle', { cx: x, cy: y, r: 5, class: 'core' }, g);
  const right = x >= 200;
  const t = svgEl('text', { x: x + (d === 24 ? 24 : right ? 14 : -14), y: y + 4, 'text-anchor': right ? 'start' : 'end', class: 'num' }, g);
  t.textContent = d;
  const act = () => {
    sel = d;
    if (d > day) { g.classList.remove('shake'); void g.getBoundingClientRect(); g.classList.add('shake'); }
    render();
  };
  g.addEventListener('click', act);
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } });
  return g;
});

function render() {
  lit.setAttribute('points', TREE.slice(0, day).map(p => p.join(',')).join(' '));
  stars.forEach((g, i) => {
    const d = i + 1;
    g.classList.toggle('open', d < day); g.classList.toggle('today', d === day); g.classList.toggle('locked', d > day); g.classList.toggle('sel', day > 0 && d === sel);
    g.setAttribute('aria-label', `Stern ${d}: ${d < day ? 'offen' : d === day ? 'heute' : 'noch zu'}`);
  });
  const card = $('#card');
  if (day === 0) {
    const n = Math.round((dec(1) - today0) / 864e5);
    card.classList.add('locked');
    $('#eye').textContent = 'Advent 2026';
    $('#q').textContent = n === 1 ? 'Morgen leuchtet der erste Stern.' : `Noch ${n} Tage bis zum ersten Stern.`;
    $('#foot').textContent = 'Der erste Stern leuchtet am Dienstag, 1. Dezember.';
    return;
  }
  const d = sel, locked = d > day;
  card.classList.toggle('locked', locked);
  $('#eye').textContent = `Stern ${d} · ${long(d)}`;
  $('#q').textContent = locked ? 'Noch zu.' : FRAGEN[d - 1];
  $('#foot').textContent = locked ? `Dieser Stern leuchtet ab ${long(d)}.` : d === 24 ? 'Frohe Weihnachten. Stell sie jemandem, der dir wichtig ist.' : 'Stell sie jemandem.';
}

// preview for the collective: open the page with #vorschau
function setDay(d) {
  day = Math.min(24, Math.max(1, d)); sel = day;
  $('#dayOut').textContent = short(day);
  $('#minus').disabled = day === 1; $('#plus').disabled = day === 24;
  render();
}
function route() {
  preview = location.hash === '#vorschau';
  $('#preview').hidden = !preview;
  document.body.classList.toggle('pv', preview);
  if (preview) setDay(Math.max(1, day));
  else { day = realDay; sel = Math.max(1, realDay); render(); }
}
$('#minus').addEventListener('click', () => setDay(day - 1));
$('#plus').addEventListener('click', () => setDay(day + 1));
addEventListener('hashchange', route);
route();

// starry sky
const cv = $('#sky'), cx = cv.getContext('2d');
let W = 0, H = 0, sky = [];
const TINTS = ['255,243,245', '212,247,122', '185,167,255', '255,211,107'];
function size() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sky = Array.from({ length: Math.round(W * H / 5200) }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() < .92 ? Math.random() * .8 + .3 : Math.random() * 1.2 + 1,
    a: Math.random() * .55 + .25, p: Math.random() * 6.28, s: Math.random() * .8 + .2,
    t: TINTS[Math.random() < .86 ? 0 : 1 + Math.floor(Math.random() * 3)],
  }));
  draw(0);
}
function draw(t) {
  cx.clearRect(0, 0, W, H);
  for (const s of sky) {
    cx.fillStyle = `rgba(${s.t},${reduce ? s.a : s.a * (.6 + .4 * Math.sin(s.p + t * .0012 * s.s))})`;
    cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.283); cx.fill();
  }
}
size();
addEventListener('resize', () => { if (Math.abs(innerWidth - W) > 2 || Math.abs(innerHeight - H) > 140) size(); });
if (!reduce) { let last = 0; const loop = t => { if (t - last > 66) { draw(t); last = t; } requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
})();
</script>

</html>
